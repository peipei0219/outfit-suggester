name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  ml:
    name: ML (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # モデルのダウンロードが要らないテストだけを動かす（torch などの重い依存は入れない）
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
