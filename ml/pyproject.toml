[project]
name = "outfit-ml"
version = "0.1.0"
description = "ML components for Outfit Suggester: CLIP-based clothing auto-tagging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# CLIP でテキスト・画像の埋め込みを計算する（Hugging Face からモデルを取得）
clip = ["torch>=2.2", "transformers>=4.40", "pillow>=10"]
# 公開データセットでの評価
eval = ["datasets>=2.18", "pillow>=10"]

[project.scripts]
outfit-ml = "outfit_ml.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outfit_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
